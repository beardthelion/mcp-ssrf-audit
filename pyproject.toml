[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-ssrf-audit"
version = "0.1.0"
description = "Guard-completeness audit for MCP server SSRF defenses (G0-G10 taxonomy)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["semgrep>=1.177.0,<1.178"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
mcp-ssrf-audit = "mcp_ssrf_audit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_ssrf_audit"]

[tool.hatch.build.targets.wheel.force-include]
"rules" = "mcp_ssrf_audit/rules"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["corpus", "rules", "dist", "build", "docs"]
