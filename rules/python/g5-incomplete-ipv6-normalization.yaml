rules:
  - id: mcp-ssrf-audit-g5-python
    mode: taint
    message: >-
      MCP tool-handler input reaches a textual IPv6-mapped-prefix check or
      rewrite ("::ffff:" startswith / substring / removeprefix / replace)
      instead of parsing the address (G5: incomplete IPv6 normalization).
      The URL parser normalizes ::ffff:a.b.c.d to hextets (::ffff:7f00:1),
      and the textual probe misses 6to4, Teredo, and case or bracket
      variants, so a mapped loopback or private address passes.
    severity: ERROR
    languages: [python]
    metadata:
      category: security
      subcategory: [audit]
      guard_class: G5
      cwe:
        - "CWE-918: Server-Side Request Forgery (SSRF)"
      confidence: HIGH
      likelihood: MEDIUM
      impact: HIGH
      technology: [mcp, python]
      advisory_refs:
        - "CVE-2026-49857 / GHSA-pvrj-8cg3-j5f8 (ymw0407/auth-fetch-mcp isPrivateV6 handles only the dotted-quad ::ffff:a.b.c.d form; the normalized hextet form passes)"
      references:
        - docs/source-sink-matrix.md
    # Source: any parameter of a function registered as an MCP entry point
    # (same contract as mcp-ssrf-audit-g0-python; see
    # docs/source-sink-matrix.md).
    pattern-sources:
      - patterns:
          - pattern: $ARG
          # metavariable-regex is a full match on the bound text, so the
          # receiver prefix must be spelled out.
          - metavariable-regex:
              metavariable: $DECO
              regex: '(.*\.)?(tool|call_tool|get_prompt)'
          - pattern-either:
              - pattern-inside: |
                  @$DECO(...)
                  def $F(..., $ARG, ...):
                    ...
              - pattern-inside: |
                  @$DECO(...)
                  async def $F(..., $ARG, ...):
                    ...
              - pattern-inside: |
                  @$DECO
                  def $F(..., $ARG, ...):
                    ...
              - pattern-inside: |
                  @$DECO
                  async def $F(..., $ARG, ...):
                    ...
      # Dispatch-method source: a function or method named like a tool
      # dispatcher whose parameters include args/params/request. Covers
      # class-based registries where a registered callback delegates to
      # `tool.execute(args)` and the sink lives in the method body.
      - patterns:
          - pattern: $ARG
          - metavariable-regex:
              metavariable: $ARG
              regex: '^(args|arguments|params|request|input)(\W.*)?$'
          - pattern-either:
              - pattern-inside: |
                  async def $M(..., $ARG, ...):
                    ...
              - pattern-inside: |
                  def $M(..., $ARG, ...):
                    ...
          - metavariable-regex:
              metavariable: $M
              regex: '^(execute|handle|dispatch|process|invoke|run|call)[a-z_0-9]*$'
      # Framework tool-entry source: agent frameworks that deliver
      # model-produced args through `Tool.forward`/`BaseTool._run`-style
      # methods on Tool-named classes deliver
      # model-produced args through methods on Tool-named classes. The
      # class-name bound keeps the method names from matching arbitrary
      # helpers. First branch: named params. Second: **kwargs, which
      # Semgrep binds separately as a ParamDict.
      - patterns:
          - pattern: $ARG
          - pattern-either:
              - pattern-inside: |
                  class $T(...):
                    ...
                    async def $M($SELF, ..., $ARG, ...):
                      ...
              - pattern-inside: |
                  class $T(...):
                    ...
                    def $M($SELF, ..., $ARG, ...):
                      ...
          - metavariable-regex:
              metavariable: $T
              regex: '(?i).*tool'
          - metavariable-regex:
              metavariable: $M
              regex: '^(forward|_?run|_?arun|_?call|_?execute|invoke|process)[a-z_0-9]*$'
          - metavariable-regex:
              metavariable: $ARG
              regex: '^(?!self$|cls$).*'
      - patterns:
          - pattern: $KW
          - pattern-either:
              - pattern-inside: |
                  class $T(...):
                    ...
                    async def $M($SELF, ..., **$KW):
                      ...
              - pattern-inside: |
                  class $T(...):
                    ...
                    def $M($SELF, ..., **$KW):
                      ...
          - metavariable-regex:
              metavariable: $T
              regex: '(?i).*tool'
          - metavariable-regex:
              metavariable: $M
              regex: '^(forward|_?run|_?arun|_?call|_?execute|invoke|process)[a-z_0-9]*$'

    # Sink: a tainted host value fed to a textual ::ffff: probe or rewrite.
    # The literal bound by $L includes its quotes; the optional [ covers the
    # bracketed-IPv6 form and [a-z]* covers r/u/f/b string prefixes.
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $X.startswith($L)
              - pattern: $X.removeprefix($L)
              - pattern: $X.replace($L, ...)
              - pattern: $L in $X
          - focus-metavariable: $X
          - metavariable-regex:
              metavariable: $L
              regex: '(?i)[a-z]*["'']\[?::ffff:[0-9a-f.:]*["'']'
